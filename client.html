<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг питания - Система анализа пищеблоков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .input-group {
            flex: 1;
            min-width: 200px;
        }
        
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #2196f3;
        }
        
        button {
            padding: 10px 24px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #1976d2;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px 30px;
            margin: 0;
            font-weight: 500;
        }
        
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }
        
        .content {
            padding: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }
        
        .section {
            background: #fafafa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .info-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .info-table td:first-child {
            font-weight: 600;
            width: 200px;
            color: #555;
        }
        
        .menu-table {
            width: 100%;
            overflow-x: auto;
        }
        
        .menu-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        .menu-table th {
            background: #2196f3;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        
        .menu-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .menu-table tr:hover {
            background: #f5f5f5;
        }
        
        .error-item {
            background: #ffebee;
            border-left: 4px solid #c62828;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        
        .error-item strong {
            color: #c62828;
        }
        
        .json-viewer {
            background: #263238;
            color: #a2f0e0;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.error {
            background: #c62828;
            color: white;
        }
        
        .badge.warning {
            background: #ff9800;
            color: white;
        }
        
        .badge.success {
            background: #4caf50;
            color: white;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading-pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .menu-table {
                font-size: 12px;
            }
            
            .menu-table th, .menu-table td {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🍽️ Федеральный центр мониторинга питания обучающихся</h1>
        <p>Система анализа и контроля качества питания в образовательных учреждениях</p>
    </div>
    
    <div class="controls">
        <div class="input-group">
            <label>🔢 Код пищеблока</label>
            <input type="number" id="foodCode" value="28605" placeholder="Введите код (например, 28605)">
        </div>
        <div class="input-group">
            <label>🏫 Название (необязательно)</label>
            <input type="text" id="schoolName" placeholder="Для поиска">
        </div>
        <button id="loadBtn">📊 Загрузить данные</button>
        <button id="exportBtn" style="background: #4caf50;">📥 Экспорт в JSON</button>
    </div>
    
    <div id="status"></div>
    
    <div id="content" style="display: none;">
        <div class="stats-grid" id="statsGrid"></div>
        
        <div class="section">
            <h2>🏫 Основная информация</h2>
            <table class="info-table" id="infoTable"></table>
        </div>
        
        <div class="section">
            <h2>📅 Ежедневное меню</h2>
            <div class="menu-table" id="menuTable"></div>
        </div>
        
        <div class="section" id="errorsSection" style="display: none;">
            <h2>⚠️ Ошибки и нарушения</h2>
            <div id="errorsList"></div>
        </div>
        
        <div class="section">
            <h2>🔍 JSON данные (для разработчиков)</h2>
            <div class="json-viewer" id="jsonViewer"></div>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api/food/';

async function loadData() {
    const code = document.getElementById('foodCode').value;
    if (!code) {
        showStatus('❌ Пожалуйста, введите код пищеблока', 'error');
        return;
    }
    
    showStatus(`⏳ Загрузка данных для пищеблока ${code}... Это может занять несколько секунд.`, 'loading');
    document.getElementById('content').style.display = 'none';
    
    try {
        const response = await fetch(API_URL + code);
        const result = await response.json();
        
        if (result.success && result.data) {
            displayData(result.data);
            showStatus(`✅ ${result.message}`, 'success');
        } else {
            showStatus(`❌ ${result.message || 'Не удалось загрузить данные'}`, 'error');
        }
    } catch (error) {
        console.error('Ошибка:', error);
        showStatus(`
            ❌ Ошибка подключения к серверу!
            
            Убедитесь, что:
            1. Сервер запущен (python server.py)
            2. Сервер работает на http://localhost:5000
            3. В консоли нет ошибок
            
            Текст ошибки: ${error.message}
        `, 'error');
    }
}

function displayData(data) {
    // Показываем контент
    document.getElementById('content').style.display = 'block';
    
    // Статистика
    const stats = data.statistics || {};
    const basicInfo = data.basic_info || {};
    
    const statsHtml = `
        <div class="stat-card">
            <h3>🏫 Код пищеблока</h3>
            <div class="value">${basicInfo.code || basicInfo.requested_code || '—'}</div>
        </div>
        <div class="stat-card">
            <h3>📅 Дней в меню</h3>
            <div class="value">${stats.total_days || 0}</div>
        </div>
        <div class="stat-card">
            <h3>🍽️ Блюд всего</h3>
            <div class="value">${stats.total_meals || 0}</div>
        </div>
        <div class="stat-card">
            <h3>⚠️ Ошибок</h3>
            <div class="value ${stats.total_errors > 0 ? 'loading-pulse' : ''}">${stats.total_errors || 0}</div>
        </div>
    `;
    document.getElementById('statsGrid').innerHTML = statsHtml;
    
    // Основная информация
    const infoHtml = `
        <tr><td>📌 Код</td><td><strong>${basicInfo.code || basicInfo.requested_code || '—'}</strong></td></tr>
        <tr><td>🏫 Наименование</td><td>${basicInfo.name || basicInfo.selected_school || '—'}</td></tr>
        <tr><td>📍 Регион</td><td>${basicInfo.region || basicInfo.selected_region || '—'}</td></tr>
        <tr><td>🗺️ Район</td><td>${basicInfo.district || '—'}</td></tr>
        <tr><td>🌐 Сайт</td><td>${basicInfo.website ? `<a href="${basicInfo.website}" target="_blank">${basicInfo.website}</a>` : '—'}</td></tr>
        <tr><td>🔄 Последнее обновление</td><td>${stats.last_update || '—'}</td></tr>
        <tr><td>🔗 Источник данных</td><td>${data.source_url || '—'}</td></tr>
    `;
    document.getElementById('infoTable').innerHTML = infoHtml;
    
    // Меню
    if (data.daily_menu && data.daily_menu.length > 0) {
        let menuHtml = '<table><thead><tr>';
        menuHtml += '<th>📅 Дата</th><th>🍽️ Приём пищи</th><th>⚖️ Выход (г)</th><th>💰 Цена (руб)</th>';
        menuHtml += '<th>🔥 Ккал</th><th>🥩 Белки</th><th>🧈 Жиры</th><th>🍚 Углеводы</th><th>⚠️ Ошибки</th>';
        menuHtml += '</tr></thead><tbody>';
        
        data.daily_menu.forEach(item => {
            const hasErrors = item.errors && item.errors !== '';
            menuHtml += `<tr ${hasErrors ? 'style="background: #ffebee;"' : ''}>`;
            menuHtml += `<td>${item.date || '—'}</td>`;
            menuHtml += `<td>${item.meal_type || '—'}</td>`;
            menuHtml += `<td>${item.weight || '—'}</td>`;
            menuHtml += `<td>${item.price || '—'}</td>`;
            menuHtml += `<td>${item.calories || '—'}</td>`;
            menuHtml += `<td>${item.proteins || '—'}</td>`;
            menuHtml += `<td>${item.fats || '—'}</td>`;
            menuHtml += `<td>${item.carbs || '—'}</td>`;
            menuHtml += `<td>${hasErrors ? `<span class="badge error">${item.errors}</span>` : '<span class="badge success">✓</span>'}</td>`;
            menuHtml += `</tr>`;
        });
        
        menuHtml += '</tbody></table>';
        document.getElementById('menuTable').innerHTML = menuHtml;
    } else {
        document.getElementById('menuTable').innerHTML = '<p>Нет данных о меню</p>';
    }
    
    // Ошибки
    if (data.errors && data.errors.length > 0) {
        document.getElementById('errorsSection').style.display = 'block';
        let errorsHtml = '';
        data.errors.forEach(error => {
            errorsHtml += `
                <div class="error-item">
                    <strong>📅 ${error.date || '—'}</strong> - ${error.meal || '—'}<br>
                    <strong>⚠️ Ошибка:</strong> ${error.error_type || '—'}<br>
                    <strong>📝 Описание:</strong> ${error.description || '—'}
                </div>
            `;
        });
        document.getElementById('errorsList').innerHTML = errorsHtml;
    } else {
        document.getElementById('errorsSection').style.display = 'none';
    }
    
    // JSON данные
    document.getElementById('jsonViewer').textContent = JSON.stringify(data, null, 2);
}

function showStatus(message, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
    
    // Автоматически скрываем успешные сообщения через 5 секунд
    if (type === 'success') {
        setTimeout(() => {
            if (statusDiv.innerHTML.includes('✅')) {
                statusDiv.innerHTML = '';
            }
        }, 5000);
    }
}

function exportToJSON() {
    const jsonText = document.getElementById('jsonViewer').textContent;
    if (jsonText && jsonText !== '') {
        const blob = new Blob([jsonText], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const code = document.getElementById('foodCode').value;
        a.href = url;
        a.download = `food_data_${code}_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showStatus('✅ Данные экспортированы в JSON файл', 'success');
    } else {
        showStatus('❌ Нет данных для экспорта. Сначала загрузите данные.', 'error');
    }
}

// Обработчики событий
document.getElementById('loadBtn').addEventListener('click', loadData);
document.getElementById('exportBtn').addEventListener('click', exportToJSON);
document.getElementById('foodCode').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loadData();
});

// Загружаем данные по умолчанию при открытии страницы
setTimeout(() => {
    if (document.getElementById('foodCode').value) {
        loadData();
    }
}, 500);
</script>
</body>
</html>
