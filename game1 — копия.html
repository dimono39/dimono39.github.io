            ctx.fillStyle = '#00E800';
            ctx.fillRect(px + 4, pipe.y + 26, 8, pipe.height - 26);
            
            // Тёмная сторона
            ctx.fillStyle = '#007000';
            ctx.fillRect(px + pipe.width - 12, pipe.y + 26, 8, pipe.height - 26);
            
            // Верхняя часть трубы
            ctx.fillStyle = '#00A800';
            ctx.fillRect(px, pipe.y, pipe.width, 28);
            
            ctx.fillStyle = '#00E800';
            ctx.fillRect(px, pipe.y, 10, 28);
            
            ctx.fillStyle = '#007000';
            ctx.fillRect(px + pipe.width - 10, pipe.y, 10, 28);
            
            // Блик
            ctx.fillStyle = '#50F850';
            ctx.fillRect(px + 12, pipe.y + 4, 6, 20);
            
            // Пиранья
            if (pipe.hasPiranha) {
                drawPiranha(px + pipe.width / 2, pipe.y + pipe.piranhaOffset);
            }
        }
    }

    function drawPiranha(x, y) {
        // Голова
        ctx.fillStyle = '#00A800';
        ctx.beginPath();
        ctx.ellipse(x, y - 10, 14, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Рот
        ctx.fillStyle = '#800000';
        ctx.beginPath();
        ctx.ellipse(x, y - 5, 10, 6, 0, 0, Math.PI);
        ctx.fill();
        
        // Зубы
        ctx.fillStyle = '#FFF';
        for (let i = -8; i <= 8; i += 4) {
            ctx.fillRect(x + i - 1, y - 10, 2, 5);
        }
        
        // Белые пятна
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(x - 5, y - 16, 4, 0, Math.PI * 2);
        ctx.arc(x + 5, y - 16, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Стебель
        ctx.fillStyle = '#00A800';
        ctx.fillRect(x - 6, y, 12, 20);
    }

    function drawCoins() {
        for (const coin of levelData.coins) {
            if (coin.collected) continue;
            
            const cx = coin.x - camera.x;
            const cy = coin.y + coin.bounceY;
            
            if (cx < -30 || cx > GAME_WIDTH + 30) continue;
            
            drawCoin(cx, cy);
        }
    }

    function drawCoin(x, y, scale = 1) {
        const frame = Math.floor(Date.now() / 100) % 4;
        const widths = [12, 8, 4, 8];
        const w = widths[frame] * scale;
        
        // Основа монеты
        ctx.fillStyle = '#F8B800';
        ctx.beginPath();
        ctx.ellipse(x + 12, y + 12, w, 12 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Контур
        ctx.strokeStyle = '#C87800';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(x + 12, y + 12, w, 12 * scale, 0, 0, Math.PI * 2);
        ctx.stroke();
        
        // Блик
        if (w > 6) {
            ctx.fillStyle = '#F8D870';
            ctx.beginPath();
            ctx.ellipse(x + 10, y + 8, w * 0.4, 4 * scale, -0.3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawPowerups() {
        for (const p of levelData.powerups) {
            if (!p.active) continue;
            
            const px = p.x - camera.x;
            
            if (px < -50 || px > GAME_WIDTH + 50) continue;
            
            if (p.type === 'mushroom') {
                drawMushroom(px, p.y, '#F83800'); // Красный гриб
            } else if (p.type === 'fireFlower') {
                drawFireFlower(px, p.y);
            } else if (p.type === 'star') {
                drawStar(px, p.y);
            } else if (p.type === '1up') {
                drawMushroom(px, p.y, '#00A800'); // Зелёный гриб
            }
        }
    }

    function drawMushroom(x, y, color) {
        // Шляпка
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x + 16, y + 12, 14, Math.PI, 0);
        ctx.fill();
        
        // Пятна
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(x + 10, y + 6, 5, 0, Math.PI * 2);
        ctx.arc(x + 22, y + 6, 5, 0, Math.PI * 2);
        ctx.fill();
        
        // Ножка
        ctx.fillStyle = '#F8D8B0';
        ctx.fillRect(x + 8, y + 12, 16, 16);
        
        // Глаза
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 10, y + 16, 4, 6);
        ctx.fillRect(x + 18, y + 16, 4, 6);
    }

    function drawFireFlower(x, y) {
        const time = Date.now() * 0.01;
        const colors = ['#F83800', '#F8D878', '#FFF'];
        const colorIndex = Math.floor(time / 8) % 3;
        
        // Лепестки
        ctx.fillStyle = colors[colorIndex];
        for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2 + time * 0.05;
            const lx = x + 16 + Math.cos(angle) * 10;
            const ly = y + 10 + Math.sin(angle) * 8;
            ctx.beginPath();
            ctx.arc(lx, ly, 6, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Центр
        ctx.fillStyle = colors[(colorIndex + 1) % 3];
        ctx.beginPath();
        ctx.arc(x + 16, y + 10, 6, 0, Math.PI * 2);
        ctx.fill();
        
        // Глаза
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 13, y + 8, 2, 4);
        ctx.fillRect(x + 17, y + 8, 2, 4);
        
        // Стебель
        ctx.fillStyle = '#00A800';
        ctx.fillRect(x + 14, y + 16, 4, 14);
    }

    function drawStar(x, y) {
        const time = Date.now() * 0.01;
        const colors = ['#F8D800', '#00F800', '#00D8F8', '#F800F8'];
        const colorIndex = Math.floor(time / 5) % 4;
        
        ctx.fillStyle = colors[colorIndex];
        
        // Звезда
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
            const r = i % 2 === 0 ? 14 : 7;
            const sx = x + 16 + Math.cos(angle) * r;
            const sy = y + 16 + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
        ctx.closePath();
        ctx.fill();
        
        // Глаза
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 11, y + 12, 3, 5);
        ctx.fillRect(x + 18, y + 12, 3, 5);
    }

    function drawEnemies() {
        for (const enemy of levelData.enemies) {
            if (!enemy.alive) continue;
            
            const ex = enemy.x - camera.x;
            
            if (ex < -50 || ex > GAME_WIDTH + 50) continue;
            
            if (enemy.state === 'dead') {
                // Перевёрнутый враг
                ctx.save();
                ctx.translate(ex + enemy.width / 2, enemy.y + enemy.height / 2);
                ctx.scale(1, -1);
                ctx.translate(-(ex + enemy.width / 2), -(enemy.y + enemy.height / 2));
                drawEnemySprite(ex, enemy.y, enemy);
                ctx.restore();
            } else {
                drawEnemySprite(ex, enemy.y, enemy);
            }
        }
    }

    function drawEnemySprite(x, y, enemy) {
        if (enemy.type === 'goomba') {
            drawGoomba(x, y, enemy);
        } else if (enemy.type === 'koopa' || enemy.type === 'parakoopa') {
            drawKoopa(x, y, enemy);
        } else if (enemy.type === 'spiny') {
            drawSpiny(x, y, enemy);
        }
    }

    function drawGoomba(x, y, enemy) {
        if (enemy.state === 'dead' && enemy.vy === 0) {
            // Раздавленный гумба
            ctx.fillStyle = '#C84C0C';
            ctx.fillRect(x + 2, y + 24, 28, 8);
            return;
        }
        
        // Тело
        ctx.fillStyle = '#C84C0C';
        ctx.beginPath();
        ctx.arc(x + 16, y + 12, 14, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(x + 2, y + 12, 28, 12);
        
        // Ноги
        const legOffset = enemy.animFrame * 3;
        ctx.fillStyle = '#503000';
        ctx.fillRect(x + 4, y + 22, 10, 10 + legOffset);
        ctx.fillRect(x + 18, y + 22, 10, 10 - legOffset);
        
        // Белые части глаз
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x + 6, y + 8, 8, 10);
        ctx.fillRect(x + 18, y + 8, 8, 10);
        
        // Зрачки
        ctx.fillStyle = '#000';
        const lookDir = enemy.facing;
        ctx.fillRect(x + 8 + lookDir * 2, y + 10, 4, 6);
        ctx.fillRect(x + 20 + lookDir * 2, y + 10, 4, 6);
        
        // Брови
        ctx.fillRect(x + 6, y + 6, 8, 2);
        ctx.fillRect(x + 18, y + 6, 8, 2);
    }

    function drawKoopa(x, y, enemy) {
        if (enemy.state === 'shell' || enemy.state === 'shellMoving') {
            // Панцирь
            ctx.fillStyle = '#00A800';
            ctx.beginPath();
            ctx.ellipse(x + 16, y + 14, 14, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Полосы
            ctx.fillStyle = '#F8D878';
            ctx.beginPath();
            ctx.ellipse(x + 16, y + 14, 8, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Тень
            ctx.fillStyle = '#005000';
            ctx.beginPath();
            ctx.ellipse(x + 16, y + 20, 12, 4, 0, 0, Math.PI);
            ctx.fill();
            
            return;
        }
        
        // Крылья для parakoopa
        if (enemy.type === 'parakoopa') {
            const wingFlap = Math.sin(Date.now() * 0.02) * 0.3;
            ctx.fillStyle = '#FFF';
            ctx.save();
            ctx.translate(x, y + 10);
            ctx.rotate(-0.5 + wingFlap);
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            ctx.save();
            ctx.translate(x + 32, y + 10);
            ctx.rotate(0.5 - wingFlap);
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        
        // Панцирь
        ctx.fillStyle = '#00A800';
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 26, 14, 12, 0, Math.PI, 0);
        ctx.fill();
        
        ctx.fillStyle = '#F8D878';
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 26, 8, 6, 0, Math.PI, 0);
        ctx.fill();
        
        // Голова
        ctx.fillStyle = '#F8D878';
        ctx.beginPath();
        ctx.arc(x + 16, y + 8, 10, 0, Math.PI * 2);
        ctx.fill();
        
        // Глаза
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(x + 12, y + 6, 5, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 20, y + 6, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x + 13, y + 7, 2, 0, Math.PI * 2);
        ctx.arc(x + 19, y + 7, 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Клюв
        ctx.fillStyle = '#F8D878';
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 14, 6, 4, 0, 0, Math.PI);
        ctx.fill();
        
        // Ноги
        ctx.fillStyle = '#F8D878';
        const legOff = enemy.animFrame * 2;
        ctx.fillRect(x + 6, y + 30, 8, 10 + legOff);
        ctx.fillRect(x + 18, y + 30, 8, 10 - legOff);
        
        // Ботинки
        ctx.fillStyle = '#F80000';
        ctx.fillRect(x + 4, y + 38 + legOff, 12, 4);
        ctx.fillRect(x + 16, y + 38 - legOff, 12, 4);
    }

    function drawSpiny(x, y, enemy) {
        // Тело
        ctx.fillStyle = '#F83800';
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 18, 14, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Шипы
        ctx.fillStyle = '#FFF';
        const time = Date.now() * 0.002;
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 + time;
            const sx = x + 16 + Math.cos(angle) * 12;
            const sy = y + 18 + Math.sin(angle) * 10;
            
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + Math.cos(angle) * 8, sy + Math.sin(angle) * 8);
            ctx.lineTo(sx + Math.cos(angle + 0.3) * 4, sy + Math.sin(angle + 0.3) * 4);
            ctx.fill();
        }
        
        // Глаза
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(x + 10, y + 14, 4, 0, Math.PI * 2);
        ctx.arc(x + 22, y + 14, 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x + 10, y + 15, 2, 0, Math.PI * 2);
        ctx.arc(x + 22, y + 15, 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Ноги
        ctx.fillStyle = '#F8D878';
        ctx.fillRect(x + 8, y + 28, 6, 6);
        ctx.fillRect(x + 18, y + 28, 6, 6);
    }

    function drawFireballs() {
        for (const fb of fireballs) {
            const fx = fb.x - camera.x;
            const frame = Math.floor(Date.now() / 50) % 4;
            
            // Огненный шар
            const colors = ['#F8D800', '#F88000', '#F83800', '#F88000'];
            ctx.fillStyle = colors[frame];
            ctx.beginPath();
            ctx.arc(fx + 6, fb.y + 6, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Ядро
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(fx + 6, fb.y + 6, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawBrickDebris() {
        ctx.fillStyle = '#C84C0C';
        
        for (const d of brickDebris) {
            ctx.save();
            ctx.translate(d.x - camera.x + 8, d.y + 8);
            ctx.rotate(d.rotation);
            ctx.fillRect(-6, -6, 12, 12);
            ctx.restore();
        }
    }

    function drawPlayer() {
        if (player.isDead && player.deadTimer < 20) return;
        
        const px = player.x - camera.x;
        const py = player.y;
        const h = player.currentHeight;
        
        // Мигание при неуязвимости
        if (player.isInvincible && !player.hasStarPower) {
            if (Math.floor(Date.now() / 50) % 2) return;
        }
        
        ctx.save();
        
        // Звёздная сила - радужный эффект
        if (player.hasStarPower) {
            const hue = (Date.now() * 0.5) % 360;
            ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
            ctx.shadowBlur = 15;
        }
        
        // Отражение по горизонтали
        if (player.facing === -1) {
            ctx.translate(px + player.width, 0);
            ctx.scale(-1, 1);
            ctx.translate(-px, 0);
        }
        
        drawMarioSprite(px, py, player.state, player.animFrame, player.isOnGround, player.isCrouching, player.isSkidding, player.isDead, player.hasStarPower);
        
        ctx.restore();
    }

    function drawMarioSprite(x, y, state, frame, onGround, crouching, skidding, dead, star) {
        // Цвета в зависимости от состояния
        let mainColor = '#F83800'; // Красный
        let overallColor = '#AC7C00'; // Коричневый
        let skinColor = '#F8B800';
        
        if (state === 'fire') {
            mainColor = '#FFF';
            overallColor = '#F83800';
        }
        
        if (star) {
            const hue = (Date.now() * 0.8) % 360;
            mainColor = `hsl(${hue}, 100%, 50%)`;
            overallColor = `hsl(${(hue + 120) % 360}, 100%, 40%)`;
        }
        
        if (dead) {
            // Марио умер - специальная поза
            drawSmallMarioPose(x, y, mainColor, skinColor, 'dead');
            return;
        }
        
        if (state === 'small') {
            if (!onGround) {
                drawSmallMarioPose(x, y, mainColor, skinColor, 'jump');
            } else if (skidding) {
                drawSmallMarioPose(x, y, mainColor, skinColor, 'skid');
            } else if (frame > 0) {
                drawSmallMarioPose(x, y, mainColor, skinColor, 'walk' + (frame % 3));
            } else {
                drawSmallMarioPose(x, y, mainColor, skinColor, 'stand');
            }
        } else {
            // Big/Fire Mario
            if (crouching) {
                drawBigMarioPose(x, y + 24, mainColor, overallColor, skinColor, 'crouch');
            } else if (!onGround) {
                drawBigMarioPose(x, y, mainColor, overallColor, skinColor, 'jump');
            } else if (skidding) {
                drawBigMarioPose(x, y, mainColor, overallColor, skinColor, 'skid');
            } else if (frame > 0) {
                drawBigMarioPose(x, y, mainColor, overallColor, skinColor, 'walk' + (frame % 3));
            } else {
                drawBigMarioPose(x, y, mainColor, overallColor, skinColor, 'stand');
            }
        }
    }

    function drawSmallMarioPose(x, y, mainColor, skinColor, pose) {
        const w = 24;
        const h = 32;
        
        // Шапка
        ctx.fillStyle = mainColor;
        ctx.fillRect(x + 4, y, 16, 8);
        ctx.fillRect(x + 2, y + 8, 8, 4);
        
        // Лицо
        ctx.fillStyle = skinColor;
        ctx.fillRect(x + 4, y + 8, 12, 12);
        
        // Волосы
        ctx.fillStyle = '#5C3C00';
        ctx.fillRect(x + 2, y + 8, 6, 4);
        
        // Глаз
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 12, y + 10, 4, 4);
        
        // Тело
        ctx.fillStyle = mainColor;
        ctx.fillRect(x + 4, y + 18, 16, 6);
        
        // Руки
        ctx.fillStyle = skinColor;
        if (pose === 'jump' || pose === 'dead') {
            ctx.fillRect(x, y + 16, 6, 4);
            ctx.fillRect(x + 18, y + 12, 6, 4);
        } else {
            ctx.fillRect(x, y + 18, 6, 4);
            ctx.fillRect(x + 18, y + 18, 6, 4);
        }
        
        // Ноги
        ctx.fillStyle = '#5C3C00';
        if (pose === 'jump' || pose === 'dead') {
            ctx.fillRect(x + 4, y + 24, 8, 4);
            ctx.fillRect(x + 12, y + 26, 8, 6);
        } else if (pose === 'walk1') {
            ctx.fillRect(x + 4, y + 24, 8, 8);
            ctx.fillRect(x + 14, y + 24, 8, 8);
        } else if (pose === 'walk2') {
            ctx.fillRect(x + 2, y + 24, 8, 8);
            ctx.fillRect(x + 14, y + 24, 10, 6);
        } else {
            ctx.fillRect(x + 4, y + 24, 16, 8);
        }
    }

    function drawBigMarioPose(x, y, mainColor, overallColor, skinColor, pose) {
        const w = 28;
        const h = 56;
        
        // Шапка
        ctx.fillStyle = mainColor;
        ctx.fillRect(x + 4, y, 20, 10);
        ctx.fillRect(x + 2, y + 10, 10, 4);
        
        // Лицо
        ctx.fillStyle = skinColor;
        ctx.fillRect(x + 4, y + 10, 16, 14);
        
        // Волосы
        ctx.fillStyle = '#5C3C00';
        ctx.fillRect(x + 2, y + 10, 8, 6);
        ctx.fillRect(x + 2, y + 16, 4, 8);
        
        // Глаз
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 14, y + 12, 4, 6);
        
        // Рубашка
        ctx.fillStyle = mainColor;
        ctx.fillRect(x + 4, y + 22, 20, 10);
        
        // Комбинезон
        ctx.fillStyle = overallColor;
        ctx.fillRect(x + 2, y + 28, 24, 16);
        
        // Лямки
        ctx.fillStyle = overallColor;
        ctx.fillRect(x + 4, y + 24, 4, 6);
        ctx.fillRect(x + 18, y + 24, 4, 6);
        
        // Пуговицы
        ctx.fillStyle = '#FFD800';
        ctx.fillRect(x + 6, y + 28, 2, 2);
        ctx.fillRect(x + 18, y + 28, 2, 2);
        
        // Руки
        ctx.fillStyle = skinColor;
        if (pose === 'jump') {
            ctx.fillRect(x - 2, y + 22, 8, 6);
            ctx.fillRect(x + 22, y + 18, 8, 6);
        } else if (pose === 'crouch') {
            ctx.fillRect(x - 2, y + 14, 8, 6);
            ctx.fillRect(x + 22, y + 14, 8, 6);
        } else {
            ctx.fillRect(x - 2, y + 24, 8, 6);
            ctx.fillRect(x + 22, y + 24, 8, 6);
        }
        
        // Перчатки
        ctx.fillStyle = '#FFF';
        if (pose !== 'crouch') {
            ctx.fillRect(x - 4, y + 28, 6, 6);
            ctx.fillRect(x + 24, y + 28, 6, 6);
        }
        
        // Ноги
        ctx.fillStyle = overallColor;
        if (pose === 'jump') {
            ctx.fillRect(x + 2, y + 42, 10, 8);
            ctx.fillRect(x + 16, y + 44, 10, 12);
        } else if (pose === 'crouch') {
            ctx.fillRect(x + 2, y + 24, 24, 8);
        } else if (pose === 'walk1' || pose === 'walk2') {
            const off = (pose === 'walk1') ? 4 : -4;
            ctx.fillRect(x + 2, y + 42, 10, 8 + off);
            ctx.fillRect(x + 14, y + 42, 10, 8 - off);
        } else {
            ctx.fillRect(x + 2, y + 42, 10, 8);
            ctx.fillRect(x + 14, y + 42, 10, 8);
        }
        
        // Ботинки
        ctx.fillStyle = '#5C3C00';
        if (pose === 'jump') {
            ctx.fillRect(x, y + 50, 12, 6);
            ctx.fillRect(x + 16, y + 52, 12, 6);
        } else if (pose !== 'crouch') {
            ctx.fillRect(x, y + 50, 12, 6);
            ctx.fillRect(x + 14, y + 50, 12, 6);
        }
    }

    function drawFlag() {
        const flag = levelData.flag;
        if (!flag) return;
        
        const fx = flag.x - camera.x;
        
        // Шест
        ctx.fillStyle = '#00A800';
        ctx.fillRect(fx + 2, flag.baseY - flag.poleHeight, 6, flag.poleHeight);
        
        // Шар
        ctx.fillStyle = '#00A800';
        ctx.beginPath();
        ctx.arc(fx + 5, flag.baseY - flag.poleHeight - 8, 10, 0, Math.PI * 2);
        ctx.fill();
        
        // Флаг
        const flagY = flag.baseY - flag.poleHeight + flag.flagY + 16;
        ctx.fillStyle = '#00A800';
        ctx.beginPath();
        ctx.moveTo(fx + 10, flagY);
        ctx.lineTo(fx + 50, flagY + 16);
        ctx.lineTo(fx + 10, flagY + 32);
        ctx.closePath();
        ctx.fill();
    }

    function drawCastle() {
        if (!levelData.castle) return;
        
        const cx = levelData.castle.x - camera.x;
        const cy = levelData.castle.y;
        const cw = TILE_SIZE * 4;
        const ch = TILE_SIZE * 4;
        
        // Основание замка
        ctx.fillStyle = '#8C8C8C';
        ctx.fillRect(cx, cy, cw, ch);
        
        // Зубцы
        for (let i = 0; i < 4; i++) {
            ctx.fillRect(cx + i * 32, cy - 16, 24, 24);
        }
        
        // Ворота
        ctx.fillStyle = '#000';
        ctx.fillRect(cx + cw / 2 - 16, cy + ch - 48, 32, 48);
        
        // Арка ворот
        ctx.fillStyle = '#8C8C8C';
        ctx.beginPath();
        ctx.arc(cx + cw / 2, cy + ch - 48, 16, Math.PI, 0);
        ctx.fill();
        
        // Окна
        ctx.fillStyle = '#000';
        ctx.fillRect(cx + 16, cy + 20, 16, 20);
        ctx.fillRect(cx + cw - 32, cy + 20, 16, 20);
    }

    function drawParticles() {
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1;
    }

    function drawFloatingTexts() {
        for (const t of floatingTexts) {
            ctx.globalAlpha = t.life;
            ctx.fillStyle = t.color;
            ctx.font = 'bold 14px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(t.text, t.x - camera.x, t.y);
        }
        ctx.globalAlpha = 1;
    }

    function drawTitleScreen() {
        // Фон
        const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        gradient.addColorStop(0, '#5C94FC');
        gradient.addColorStop(1, '#000');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        // Облака
        ctx.fillStyle = '#FFF';
        for (let i = 0; i < 6; i++) {
            const cx = ((i * 150 + Date.now() * 0.02) % (GAME_WIDTH + 200)) - 100;
            ctx.beginPath();
            ctx.arc(cx, 60 + (i % 3) * 30, 20, 0, Math.PI * 2);
            ctx.arc(cx + 20, 55 + (i % 3) * 30, 25, 0, Math.PI * 2);
            ctx.arc(cx + 40, 60 + (i % 3) * 30, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Земля
        ctx.fillStyle = '#C84C0C';
        ctx.fillRect(0, GAME_HEIGHT - 64, GAME_WIDTH, 64);
        ctx.fillStyle = '#00A800';
        ctx.fillRect(0, GAME_HEIGHT - 64, GAME_WIDTH, 16);
        
        // Заголовок
        const bounce = Math.sin(Date.now() * 0.003) * 5;
        
        ctx.fillStyle = '#F83800';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SUPER MARIO', GAME_WIDTH / 2 + 3, 120 + bounce + 3);
        
        ctx.fillStyle = '#FFF';
        ctx.fillText('SUPER MARIO', GAME_WIDTH / 2, 120 + bounce);
        
        ctx.fillStyle = '#FFD800';
        ctx.font = 'bold 32px Arial';
        ctx.fillText('ULTIMATE EDITION', GAME_WIDTH / 2, 165 + bounce);
        
        // Анимированный Марио
        const marioX = GAME_WIDTH / 2 - 50;
        const marioY = GAME_HEIGHT - 100;
        const frame = Math.floor(Date.now() / 150) % 3;
        
        ctx.save();
        ctx.translate(marioX, marioY);
        drawSmallMarioPose(0, 0, '#F83800', '#F8B800', 'walk' + frame);
        ctx.restore();
        
        // Монета и гриб
        drawCoin(GAME_WIDTH / 2 + 20, GAME_HEIGHT - 120, 1.5);
        drawMushroom(GAME_WIDTH / 2 + 60, GAME_HEIGHT - 90, '#F83800');
        
        // Инструкция
        const blink = Math.floor(Date.now() / 500) % 2;
        if (blink) {
            ctx.fillStyle = '#FFF';
            ctx.font = '20px Courier New';
            ctx.fillText('НАЖМИТЕ ПРОБЕЛ ИЛИ JUMP', GAME_WIDTH / 2, GAME_HEIGHT - 160);
        }
        
        // Управление
        ctx.fillStyle = '#AAA';
        ctx.font = '14px Courier New';
        ctx.fillText('← → или A D - Движение   |   ↑ или W / SPACE - Прыжок', GAME_WIDTH / 2, GAME_HEIGHT - 30);
        ctx.fillText('X или CTRL - Огонь   |   SHIFT - Бег', GAME_WIDTH / 2, GAME_HEIGHT - 12);
        
        // Рекорд
        const scores = HighScores.get();
        if (scores.length > 0) {
            ctx.fillStyle = '#FFD800';
            ctx.font = '16px Courier New';
            ctx.fillText(`РЕКОРД: ${scores[0].score.toString().padStart(6, '0')}`, GAME_WIDTH / 2, 200);
        }
    }

    function drawPauseOverlay() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ПАУЗА', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);
        
        ctx.font = '20px Courier New';
        ctx.fillText('Нажмите P или ESC для продолжения', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 30);
    }

    function drawGameOverScreen() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        ctx.fillStyle = '#F83800';
        ctx.font = 'bold 56px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50);
        
        ctx.fillStyle = '#FFF';
        ctx.font = '24px Courier New';
        ctx.fillText(`СЧЁТ: ${score.toString().padStart(6, '0')}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
        ctx.fillText(`МОНЕТЫ: ${coins}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 40);
        
        ctx.fillStyle = '#FFD800';
        ctx.font = '18px Courier New';
        ctx.fillText('Нажмите ПРОБЕЛ для новой игры', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 90);
    }

    function drawWinScreen() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        // Фейерверк
        const time = Date.now() * 0.01;
        for (let i = 0; i < 30; i++) {
            const hue = (i * 20 + time * 10) % 360;
            ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
            const fx = GAME_WIDTH / 2 + Math.cos(time * 0.3 + i) * (120 + Math.sin(time * 0.5 + i) * 80);
            const fy = GAME_HEIGHT / 2 + Math.sin(time * 0.4 + i * 1.5) * 100;
            ctx.beginPath();
            ctx.arc(fx, fy, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.fillStyle = '#FFD800';
        ctx.font = 'bold 56px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 ПОБЕДА! 🏆', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 60);
        
        ctx.fillStyle = '#FFF';
        ctx.font = '28px Courier New';
        ctx.fillText(`ФИНАЛЬНЫЙ СЧЁТ: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2);
        
        ctx.font = '22px Courier New';
        ctx.fillText('Поздравляем! Вы прошли все уровни!', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 45);
        
        ctx.fillStyle = '#FFD800';
        ctx.font = '18px Courier New';
        ctx.fillText('Нажмите ПРОБЕЛ для новой игры', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 100);
    }

    function updateUI() {
        document.getElementById('score').textContent = score.toString().padStart(6, '0');
        document.getElementById('coins').textContent = coins.toString().padStart(2, '0');
        document.getElementById('world').textContent = levelData ? levelData.name : '1-1';
        document.getElementById('timer').textContent = timer;
        document.getElementById('lives').textContent = '×' + lives;
    }

    // === ИГРОВЫЕ ФУНКЦИИ ===
    function startGame() {
        gameState = 'playing';
        currentLevel = 0;
        score = 0;
        coins = 0;
        lives = 3;
        
        resetLevel();
        showLevelIntro();
    }

    function resetLevel() {
        levelData = generateLevel(currentLevel);
        
        player.x = 48;
        player.y = GROUND_Y - (player.state === 'small' ? 48 : 72);
        player.vx = 0;
        player.vy = 0;
        player.isDead = false;
        player.deadTimer = 0;
        player.isVictory = false;
        player.victoryTimer = 0;
        player.isOnGround = false;
        player.isCrouching = false;
        player.animFrame = 0;
        
        camera.x = 0;
        camera.targetX = 0;
        camera.shake = 0;
        
        timer = CONFIG.maxTime;
        timerCounter = 0;
        
        fireballs = [];
        particles = [];
        floatingTexts = [];
        brickDebris = [];
        
        gameState = 'playing';
    }

    function restartGame() {
        gameState = 'title';
        player.state = 'small';
        player.hasFire = false;
        player.hasStarPower = false;
        player.isInvincible = false;
    }

    function showLevelIntro() {
        const indicator = document.getElementById('levelIndicator');
        document.querySelector('#levelIndicator .level-name').textContent = levelData.name;
        document.getElementById('livesIndicator').textContent = lives;
        
        indicator.classList.add('show');
        gameState = 'paused';
        
        setTimeout(() => {
            indicator.classList.remove('show');
            gameState = 'playing';
        }, 2000);
    }

    // === ГЛАВНЫЙ ЦИКЛ ===
    function gameLoop() {
        // Обновление
        if (gameState === 'playing') {
            updatePlayer();
            updateEnemies();
            updateFireballs();
            updateBlocks();
            updatePipes();
            checkPlayerEnemyCollision();
            checkCoinCollection();
            checkPowerupCollection();
            checkFlagpole();
            updateCamera();
            updateTimer();
        }
        
        updateParticles();
        
        // Отрисовка
        render();
        
        requestAnimationFrame(gameLoop);
    }

    // Запуск
    gameLoop();
    </script>
</body>
</html>
