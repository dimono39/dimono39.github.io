        }

            gap: 16px;
            flex-wrap: wrap;
        }

            border-radius: 30px;
            font-size: 14px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge strong {
            color: #f0f6fc;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: #161b22;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #30363d;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;

            background: #0d1117;
            color: #c9d1d9;
            font-size: 15px;
            transition: all 0.2s;
        }

        .search-input:focus {

            border-color: #58a6ff;

        }

            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 30px;
            background: #0d1117;
            color: #8b949e;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: #1c2333;
            border-color: #58a6ff;
            color: #f0f6fc;
        }

        .filter-btn.active {
            background: #238636;
            border-color: #238636;
            color: white;
        }

            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .project-card:hover {
            background: #1c2333;
            border-color: #58a6ff;
            transform: translateX(6px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .project-icon {
            font-size: 42px;
            min-width: 56px;
            text-align: center;
            line-height: 1;
            margin-top: 4px;
        }

        .project-content {
            flex: 1;
            min-width: 0;
        }

        .project-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .project-name {
            font-size: 22px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .project-name a {
            color: #f0f6fc;
            text-decoration: none;
            transition: color 0.2s;
        }

        .project-name a:hover {
            color: #58a6ff;
        }

        .project-name .no-link {
            color: #8b949e;
            cursor: default;
        }

            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tech-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #21262d;
            color: #58a6ff;
        }

        .tech-tag.html { color: #e34c26; }
        .tech-tag.css { color: #563d7c; }

            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 700;

            margin: 8px 0 12px;
            padding: 12px 16px;
            background: #0d1117;
            border-radius: 10px;
            border-left: 3px solid #58a6ff;
        }

        .project-description .highlight {
            color: #fbbf24;
        }

        .project-features {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .feature-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: #1f2937;
            color: #8b949e;

            color: #58a6ff;
        }

            gap: 16px 24px;
            font-size: 13px;
            color: #484f58;

            text-decoration: none;
        }

        }

            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

            font-size: 13px;
            font-weight: 600;
            text-decoration: none;

            border: none;
            cursor: pointer;

            color: white;
        }

            from { opacity: 0; transform: translateY(20px); }

        "moto-calc": { name: "🏍️ Мото-калькуляторы", icon: "🏍️" },
        "tools": { name: "🔧 Инструменты", icon: "🔧" },
        "other": { name: "📁 Прочее", icon: "📁" }
    };

    // ============================================================
    //  РЕНДЕРИНГ
    // ============================================================
    function getTechClass(tech) {
        const map = {
            'python': 'python',
            'javascript': 'javascript',
            'html': 'html',
            'css': 'css',
            'node.js': 'node',
            'nodejs': 'node',
            'arduino': 'arduino',
            'blockly': 'blockly'
        };
        const key = tech.toLowerCase();
        for (const [k, v] of Object.entries(map)) {
            if (key.includes(k)) return v;
        }
        return '';
    }

    function renderProjects(projects) {
        const container = document.getElementById('projectsContainer');
        if (!projects.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <h3>Ничего не найдено</h3>
                    <p>Попробуйте изменить параметры поиска или фильтрации</p>
                </div>
            `;
            return;
        }

        // Группировка по категориям
        const grouped = {};
        projects.forEach(p => {
            const cat = p.category || 'other';
            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push(p);
        });

        let html = '';
        let total = 0;

        for (const [catKey, catProjects] of Object.entries(grouped)) {
            const catInfo = CATEGORIES[catKey] || { name: catKey, icon: '📁' };
            total += catProjects.length;

            html += `
                <div class="category-section" data-category="${catKey}">
                    <div class="category-title">
                        ${catInfo.icon} ${catInfo.name}
                        <span class="count">(${catProjects.length})</span>
                    </div>
            `;

            catProjects.forEach(p => {
                const link = p.hasIndex ? `<a href="/${p.name}/">${p.name}</a>` : `<span class="no-link">${p.name}</span>`;
                const techTags = p.techStack.map(t => 
                    `<span class="tech-tag ${getTechClass(t)}">${t}</span>`
                ).join('');

                const featureTags = p.features.map(f =>
                    `<span class="feature-tag"><i class="fas fa-check"></i> ${f}</span>`
                ).join('');

                const isNew = new Date(p.lastModified) > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

                html += `
                    <div class="project-card" data-name="${p.name.toLowerCase()}" data-category="${p.category}">
                        <div class="project-icon">${p.icon}</div>
                        <div class="project-content">
                            <div class="project-header">
                                <div class="project-name">
                                    ${link}
                                    ${isNew ? '<span class="new-badge">новое</span>' : ''}
                                </div>
                                <div class="project-tech-stack">${techTags}</div>
                            </div>
                            
                            <div class="project-description">
                                ${p.description}
                            </div>
                            
                            <div class="project-features">${featureTags}</div>
                            
                            <div class="project-meta">
                                <span><i class="fas fa-calendar-alt"></i> ${p.lastModified}</span>
                                <span><i class="fas fa-file"></i> ${p.filesCount} файлов</span>
                                <span><i class="fas fa-link"></i> ${p.hasIndex ? '<a href="/' + p.name + '/" class="link">Открыть проект</a>' : 'нет index.html'}</span>
                            </div>
                            
                            <div class="project-actions">
                                ${p.hasIndex ? `<a href="/${p.name}/" class="btn btn-primary"><i class="fas fa-external-link-alt"></i> Открыть</a>` : ''}
                                <button class="btn btn-secondary" onclick="copyProjectPath('${p.name}')"><i class="fas fa-copy"></i> Путь</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
        }

        container.innerHTML = html;
        document.getElementById('totalProjects').textContent = total;
        document.getElementById('totalCategories').textContent = Object.keys(grouped).length;
    }

    // ============================================================
    //  ПОИСК И ФИЛЬТРАЦИЯ
    // ============================================================
    function filterProjects() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const activeFilter = document.querySelector('.filter-btn.active');
        const filter = activeFilter ? activeFilter.dataset.filter : 'all';

        const cards = document.querySelectorAll('.project-card');
        const sections = document.querySelectorAll('.category-section');

        cards.forEach(card => {
            const name = card.dataset.name || '';
            const category = card.dataset.category || '';
            const text = card.textContent.toLowerCase();

            const matchSearch = name.includes(query) || text.includes(query);
            const matchFilter = filter === 'all' || category === filter;

            card.style.display = (matchSearch && matchFilter) ? 'flex' : 'none';
        });

        sections.forEach(section => {
            const visible = section.querySelectorAll('.project-card[style*="flex"]').length;
            const countEl = section.querySelector('.category-title .count');
            if (countEl) countEl.textContent = `(${visible})`;
            section.style.display = visible > 0 ? 'block' : 'none';
        });
    }

    // ============================================================
    //  КОПИРОВАНИЕ ПУТИ
    // ============================================================
    function copyProjectPath(name) {
        const path = window.location.origin + '/' + name + '/';
        navigator.clipboard.writeText(path).then(() => {
            showToast(`📋 Путь скопирован: ${path}`);
        }).catch(() => {
            // Fallback
            const input = document.createElement('input');
            input.value = path;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast(`📋 Путь скопирован: ${path}`);
        });
    }

    // ============================================================
    //  TOAST-УВЕДОМЛЕНИЯ
    // ============================================================
    function showToast(message) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.cssText = `
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f2937;
            color: #f0f6fc;
            padding: 12px 24px;
            border-radius: 12px;
            border-left: 4px solid #58a6ff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            font-size: 14px;
            z-index: 9999;
            animation: fadeInUp 0.3s ease;
            max-width: 400px;
        `;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ============================================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        // Дата генерации
        document.getElementById('generatedDate').textContent = new Date().toLocaleDateString('ru-RU', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });

        // Рендерим проекты
        renderProjects(PROJECTS);

        // Поиск
        document.getElementById('searchInput').addEventListener('input', filterProjects);

        // Фильтры
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                filterProjects();
            });
        });

        // Кнопка "Все" по умолчанию активна
        document.querySelector('.filter-btn[data-filter="all"]')?.classList.add('active');

        // Глобальная функция для копирования
        window.copyProjectPath = copyProjectPath;
    });
</script>
</body>
</html>
