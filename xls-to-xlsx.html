<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLS в XLSX Конвертер</title>
    <!-- Подключаем библиотеки: SheetJS для работы с Excel, JSZip для создания архивов, FileSaver для скачивания -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e8c3a 0%, #0d5e21 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1e8c3a;
            margin-bottom: 10px;
            font-size: 2.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 span {
            font-size: 1.4em;
        }
        .subtitle {
            color: #555;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .drop-zone {
            border: 3px dashed #1e8c3a;
            border-radius: 15px;
            padding: 50px 20px;
            margin-bottom: 25px;
            background: #f4faf6;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #0d5e21;
            background: #e8f5e9;
            transform: scale(1.01);
        }
        .drop-zone.dragover {
            box-shadow: 0 0 30px rgba(30, 140, 58, 0.3);
        }
        .file-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .drop-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 8px;
        }
        .drop-hint {
            font-size: 0.9em;
            color: #777;
        }
        input[type="file"] {
            display: none;
        }
        .file-list {
            text-align: left;
            margin-bottom: 25px;
            max-height: 200px;
            overflow-y: auto;
            background: #fafafa;
            border-radius: 10px;
            padding: 15px;
            display: none;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 5px;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
            font-size: 0.95em;
        }
        .file-item .name {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .size {
            color: #888;
            margin-left: 10px;
            font-size: 0.85em;
            white-space: nowrap;
        }
        .remove-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0 5px;
            margin-left: 8px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .remove-btn:hover {
            opacity: 1;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .convert-btn {
            background: #1e8c3a;
            color: white;
        }
        .convert-btn:hover:not(:disabled) {
            background: #0d5e21;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 140, 58, 0.4);
        }
        .clear-btn {
            background: #eee;
            color: #555;
        }
        .clear-btn:hover {
            background: #ddd;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(40%);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-weight: 500;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        .status.info {
            background: #e3f2fd;
            color: #1565c0;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .count-badge {
            background: #1e8c3a;
            color: white;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.8em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>📊</span> XLS → XLSX
        </h1>
        <p class="subtitle">Конвертируйте старые файлы Excel в современный формат</p>
        
        <!-- Зона для перетаскивания файлов -->
        <div class="drop-zone" id="dropZone">
            <div class="file-icon">📁</div>
            <div class="drop-text">Перетащите файлы .xls сюда</div>
            <div class="drop-hint">или нажмите для выбора</div>
        </div>
        <input type="file" id="fileInput" accept=".xls" multiple>
        
        <!-- Список выбранных файлов -->
        <div class="file-list" id="fileList"></div>
        
        <!-- Кнопки управления -->
        <div class="buttons">
            <button class="convert-btn" id="convertBtn" disabled>
                <span>🔄</span> Конвертировать
            </button>
            <button class="clear-btn" id="clearBtn">
                <span>🗑️</span> Очистить
            </button>
        </div>
        
        <!-- Статус-сообщения -->
        <div class="status" id="status"></div>
    </div>

    <script>
        (function() {
            // --- DOM элементы ---
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const fileListDiv = document.getElementById('fileList');
            const convertBtn = document.getElementById('convertBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusDiv = document.getElementById('status');

            // --- Хранилище выбранных файлов ---
            let selectedFiles = [];

            // --- Функция обновления UI (список файлов, кнопки) ---
            function updateUI() {
                // Показываем/скрываем список файлов
                if (selectedFiles.length > 0) {
                    fileListDiv.style.display = 'block';
                    let html = '';
                    selectedFiles.forEach((file, index) => {
                        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                        html += `
                            <div class="file-item">
                                <span class="name">📄 ${escapeHtml(file.name)}</span>
                                <span class="size">${sizeMB} МБ</span>
                                <button class="remove-btn" data-index="${index}" title="Удалить">✕</button>
                            </div>
                        `;
                    });
                    fileListDiv.innerHTML = html;
                    
                    // Навешиваем обработчики на кнопки удаления
                    document.querySelectorAll('.remove-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const index = parseInt(btn.getAttribute('data-index'));
                            removeFile(index);
                        });
                    });
                } else {
                    fileListDiv.style.display = 'none';
                    fileListDiv.innerHTML = '';
                }
                
                // Активируем/деактивируем кнопку конвертации
                convertBtn.disabled = selectedFiles.length === 0;
                
                // Обновляем текст на кнопке
                if (selectedFiles.length === 0) {
                    convertBtn.innerHTML = '<span>🔄</span> Конвертировать';
                } else if (selectedFiles.length === 1) {
                    convertBtn.innerHTML = '<span>🔄</span> Конвертировать 1 файл';
                } else {
                    convertBtn.innerHTML = `<span>🔄</span> Конвертировать ${selectedFiles.length} файла (в ZIP)`;
                }
            }

            // --- Экранирование HTML для безопасности ---
            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            // --- Добавление файлов в список ---
            function addFiles(files) {
                let addedCount = 0;
                for (const file of files) {
                    // Проверяем расширение (и .xls, и .XLS)
                    if (file.name.toLowerCase().endsWith('.xls')) {
                        // Проверяем, нет ли уже файла с таким именем
                        if (!selectedFiles.some(f => f.name === file.name)) {
                            selectedFiles.push(file);
                            addedCount++;
                        }
                    }
                }
                if (addedCount > 0) {
                    showStatus(`Добавлено файлов: ${addedCount}`, 'info');
                } else if (files.length > 0) {
                    showStatus('Файлы не добавлены (неверный формат или уже есть в списке)', 'error');
                }
                updateUI();
                // Сбрасываем input, чтобы можно было выбрать те же файлы повторно
                fileInput.value = '';
            }

            // --- Удаление одного файла ---
            function removeFile(index) {
                selectedFiles.splice(index, 1);
                showStatus('Файл удалён из списка', 'info');
                updateUI();
            }

            // --- Очистка всего списка ---
            function clearAllFiles() {
                if (selectedFiles.length === 0) return;
                selectedFiles = [];
                showStatus('Список файлов очищен', 'info');
                updateUI();
                fileInput.value = '';
            }

            // --- Отображение статуса ---
            function showStatus(message, type = 'info') {
                statusDiv.textContent = message;
                statusDiv.className = `status ${type}`;
                // Автоматически скрываем success/info через 5 секунд
                if (type === 'success' || type === 'info') {
                    setTimeout(() => {
                        if (statusDiv.textContent === message) {
                            statusDiv.textContent = '';
                            statusDiv.className = 'status';
                        }
                    }, 5000);
                }
            }

            // --- Конвертация одного XLS файла в XLSX (возвращает Blob) ---
            function convertXlsToXlsx(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const data = new Uint8Array(e.target.result);
                            // Читаем книгу XLS (бинарный формат)
                            const workbook = XLSX.read(data, { type: 'array' });
                            
                            // Записываем в XLSX
                            const xlsxData = XLSX.write(workbook, { 
                                type: 'array', 
                                bookType: 'xlsx' 
                            });
                            
                            // Создаём Blob
                            const blob = new Blob([xlsxData], { 
                                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' 
                            });
                            
                            resolve(blob);
                        } catch (err) {
                            reject(new Error(`Ошибка обработки файла "${file.name}": ${err.message}`));
                        }
                    };
                    reader.onerror = function() {
                        reject(new Error(`Не удалось прочитать файл "${file.name}"`));
                    };
                    reader.readAsArrayBuffer(file);
                });
            }

            // --- Основная функция конвертации ---
            async function convertFiles() {
                if (selectedFiles.length === 0) return;
                
                // Блокируем кнопку на время обработки
                convertBtn.disabled = true;
                convertBtn.innerHTML = '<span class="spinner"></span> Конвертация...';
                showStatus(`Обрабатывается ${selectedFiles.length} файл(ов)...`, 'info');
                
                try {
                    if (selectedFiles.length === 1) {
                        // --- Один файл: просто скачиваем XLSX ---
                        const file = selectedFiles[0];
                        const xlsxBlob = await convertXlsToXlsx(file);
                        
                        // Формируем имя выходного файла
                        const newName = file.name.replace(/\.xls$/i, '.xlsx');
                        
                        // Скачиваем
                        saveAs(xlsxBlob, newName);
                        
                        showStatus(`✅ Файл "${file.name}" успешно сконвертирован в "${newName}"`, 'success');
                    } else {
                        // --- Несколько файлов: упаковываем в ZIP ---
                        const zip = new JSZip();
                        const promises = selectedFiles.map(async (file) => {
                            const xlsxBlob = await convertXlsToXlsx(file);
                            const newName = file.name.replace(/\.xls$/i, '.xlsx');
                            zip.file(newName, xlsxBlob);
                        });
                        
                        await Promise.all(promises);
                        
                        // Генерируем ZIP архив
                        const zipBlob = await zip.generateAsync({ 
                            type: 'blob',
                            compression: 'DEFLATE',
                            compressionOptions: { level: 6 }
                        });
                        
                        // Имя архива
                        const timestamp = new Date().toISOString().slice(0, 10);
                        const archiveName = `converted_xlsx_${timestamp}.zip`;
                        
                        saveAs(zipBlob, archiveName);
                        
                        showStatus(`✅ ${selectedFiles.length} файлов сконвертированы и упакованы в архив "${archiveName}"`, 'success');
                    }
                } catch (error) {
                    console.error('Ошибка конвертации:', error);
                    showStatus(`❌ ${error.message}`, 'error');
                } finally {
                    // Разблокируем кнопку
                    updateUI();
                }
            }

            // --- Обработчики событий ---
            
            // Клик по зоне — открываем выбор файлов
            dropZone.addEventListener('click', () => {
                fileInput.click();
            });
            
            // Выбор файлов через диалог
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    addFiles(e.target.files);
                }
            });
            
            // Drag & Drop события
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
                
                if (e.dataTransfer.files.length > 0) {
                    addFiles(e.dataTransfer.files);
                }
            });
            
            // Предотвращаем стандартное поведение для всей страницы
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                document.body.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                });
            });
            
            // Кнопка "Конвертировать"
            convertBtn.addEventListener('click', convertFiles);
            
            // Кнопка "Очистить"
            clearBtn.addEventListener('click', clearAllFiles);
            
            // Инициализация UI
            updateUI();
            showStatus('Готов к работе. Добавьте файлы .xls', 'info');
        })();
    </script>
</body>
</html>
