<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Система управления школьным питанием</title>
    
    <!-- Общие стили (встроенные, чтобы избежать 404) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/generator.css">
	<link rel="stylesheet" href="css/editor.css">    
	
	
    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #17a2b8;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --border-radius: 10px;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Шапка */
        .main-header {
            background: linear-gradient(135deg, var(--primary), #1a2530);
            color: white;
            padding: 20px 30px;
            box-shadow: var(--box-shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--secondary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo h1 {
            font-size: 1.5rem;
        }

        /* Переключатель модулей */
        .module-switcher {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 50px;
        }

        .module-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-btn i {
            font-size: 1.1rem;
        }

        .module-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .module-btn.active {
            background: linear-gradient(135deg, var(--secondary), #2980b9);
            box-shadow: 0 2px 10px rgba(52, 152, 219, 0.3);
        }

        /* Индикатор сохранения */
        .save-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            font-size: 0.85rem;
        }

        .save-indicator.saving {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Контейнер модуля */
        #module-container {
            max-width: 1800px;
            margin: 30px auto;
            padding: 0 20px;
            transition: opacity 0.3s ease;
        }

        /* Глобальные уведомления */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            border-radius: 50px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 2000;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.3s ease;
        }

        .toast-notification.show {
            display: flex;
        }

        .toast-notification.success {
            background: linear-gradient(135deg, var(--success), #219653);
            color: white;
        }

        .toast-notification.error {
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: white;
        }

        .toast-notification.info {
            background: linear-gradient(135deg, var(--info), #138496);
            color: white;
        }

        .toast-notification.warning {
            background: linear-gradient(135deg, var(--warning), #e67e22);
            color: white;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Общие классы для карточек */
        .card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            color: var(--primary);
            border-bottom: 2px solid var(--light);
            padding-bottom: 15px;
            font-size: 1.3rem;
        }

        /* Кнопки */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), #2980b9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #219653);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #e67e22);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, var(--info), #138496);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        /* Формы */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e6ed;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    
    <!-- Загрузка библиотек (глобально, до модулей) -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "xlsx": "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
                "file-saver": "https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js",
                "jszip": "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
                "chart.js": "https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js",
                "exceljs": "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <header class="main-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-utensils"></i>
                    <h1>PRO Школьное питание</h1>
                </div>
                <div class="module-switcher">
                    <button class="module-btn active" data-module="generator">
                        <i class="fas fa-magic"></i>
                        <span>Генератор меню</span>
                    </button>
                    <button class="module-btn" data-module="editor">
                        <i class="fas fa-edit"></i>
                        <span>Редактор меню</span>
                    </button>
                </div>
                <div class="save-indicator" id="saveIndicator">
                    <i class="fas fa-save"></i>
                    <span>Автосохранение</span>
                </div>
            </div>
        </header>
        
        <main id="module-container"></main>
        
        <div id="global-toast" class="toast-notification"></div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
