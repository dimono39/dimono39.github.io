<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Blocks - Визуальное программирование</title>
    
    <!-- Google Blockly -->
    <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly@10.4.3/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10.4.3/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10.4.3/msg/ru.js"></script>
    
    <!-- Blockly стили -->
    <link rel="stylesheet" href="https://unpkg.com/blockly@10.4.3/media/common.css">
    
    <!-- Наши стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Заголовок -->
        <header class="app-header">
            <h1>🤖 Arduino Blocks</h1>
            <div class="header-controls">
                <select id="board-selector" class="board-select">
                    <option value="">Выберите плату...</option>
                </select>
                <button id="btn-generate" class="btn btn-primary" disabled>
                    ⚡ Сгенерировать код
                </button>
                <button id="btn-copy" class="btn btn-secondary" disabled>
                    📋 Копировать
                </button>
                <button id="btn-download" class="btn btn-secondary" disabled>
                    💾 Скачать .ino
                </button>
            </div>
        </header>

        <!-- Основная область -->
        <div class="main-content">
            <!-- Левая панель - блоки -->
            <aside class="toolbox-panel" id="toolbox-panel">
                <h3>Блоки</h3>
                <div id="blockly-toolbox" class="toolbox-categories">
                    <!-- Будет заполнено динамически -->
                </div>
            </aside>

            <!-- Центр - рабочая область -->
            <main class="workspace-area">
                <div id="blockly-workspace" class="blockly-workspace"></div>
            </main>

            <!-- Правая панель - код -->
            <aside class="code-panel" id="code-panel">
                <div class="code-header">
                    <h3>Сгенерированный код</h3>
                    <span class="board-info" id="board-info"></span>
                </div>
                <pre id="generated-code" class="code-output">
// Выберите плату и соберите программу из блоков
// Затем нажмите "Сгенерировать код"
                </pre>
                <div class="code-actions">
                    <button id="btn-validate" class="btn btn-small" disabled>
                        🔍 Проверить синтаксис
                    </button>
                </div>
            </aside>
        </div>

        <!-- Футер -->
        <footer class="app-footer">
            <div class="footer-controls">
                <button id="btn-save" class="btn btn-small">💾 Сохранить проект</button>
                <button id="btn-load" class="btn btn-small">📂 Загрузить</button>
                <button id="btn-clear" class="btn btn-small btn-danger">🗑️ Очистить</button>
            </div>
            <div class="footer-info">
                <span id="workspace-info">Блоков: 0</span>
            </div>
        </footer>

        <!-- Скрытое поле для загрузки файлов -->
        <input type="file" id="file-input" accept=".xml" style="display: none;">
    </div>

    <!-- Модальное окно для добавления пользовательских блоков -->
    <div id="modal-custom-block" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Добавить пользовательский блок</h2>
            <form id="custom-block-form">
                <label>Название блока:</label>
                <input type="text" id="custom-block-name" required>
                <label>Код C++ (используйте {{value}} для входных параметров):</label>
                <textarea id="custom-block-code" rows="4" required></textarea>
                <label>Категория:</label>
                <select id="custom-block-category">
                    <option value="custom">Пользовательские</option>
                    <option value="logic">Логика</option>
                    <option value="math">Математика</option>
                </select>
                <button type="submit" class="btn btn-primary">Добавить блок</button>
            </form>
        </div>
    </div>

    <!-- Наши скрипты -->
    <script src="js/boards.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
